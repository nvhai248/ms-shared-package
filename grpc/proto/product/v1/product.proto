syntax = "proto3";

package product.v1;

option go_package = "github.com/nvhai248/ms-shared-package/grpc/pb/product/v1;productv1";

service ProductService {
  rpc GetProduct (GetProductRequest) returns (ProductResponse);
  rpc ListProducts (ListProductsRequest) returns (ListProductsResponse);
}

message Product {
  string id = 1;
  string name = 2;
  string description = 3;
  double price = 4;
  int32 stock = 5;
}

message GetProductRequest {
  string id = 1;
}

message ListProductsRequest {
  int32 page = 1;
  int32 limit = 2;
  string query = 3;
}

message ProductResponse {
  bool success = 1;
  string message = 2;
  Product product = 3;
}

message ListProductsResponse {
  bool success = 1;
  string message = 2;
  repeated Product products = 3;
  int32 total = 4;
}
