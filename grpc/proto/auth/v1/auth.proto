syntax = "proto3";

package auth.v1;

option go_package = "github.com/nvhai248/ms-shared-package/grpc/pb/auth/v1;authv1";

service AuthService {
  rpc Login (LoginRequest) returns (LoginResponse);
  rpc ValidateToken (ValidateTokenRequest) returns (ValidateTokenResponse);
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message UserInfo {
  string id = 1;
  string username = 2;
  string full_name = 3;
  string email = 4;
  string role = 5;
}

message LoginResponse {
  bool success = 1;
  string message = 2;
  string token = 3;
  UserInfo user = 4;
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  UserInfo user = 2;
  string error_message = 3;
}
